services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RESUME_PROFILE: demo
      RESUME_ALLOWED_PROFILES: '["demo"]'
      RESUME_EMBEDDING_ENABLED: "false"
      RESUME_CACHE_BACKEND: memory
      RESUME_HISTORY_ENABLED: "true"
    volumes:
      - ./data:/app/data
  api:
    build: .
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RESUME_PROFILE: demo
      RESUME_ALLOWED_PROFILES: '["demo"]'
      RESUME_EMBEDDING_ENABLED: "false"
      RESUME_CACHE_BACKEND: memory
      RESUME_API_RATE_LIMIT_PER_MINUTE: "60"
    volumes:
      - ./data:/app/data
