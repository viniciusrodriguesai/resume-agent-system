[theme]
base = "light"
primaryColor = "#5B5BD6"
backgroundColor = "#F5F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16181D"
font = "sans serif"

[server]
maxUploadSize = 10
maxMessageSize = 10
enableXsrfProtection = true
enableCORS = true
headless = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
