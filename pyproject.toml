[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-match-ai"
version = "6.0.6"
description = "Analisador local, explicável e multiagente de currículos e vagas"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vinicius Mangueira"}]
dependencies = [
  "streamlit>=1.45,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "rapidfuzz>=3.9,<4",
  "plotly>=5.24,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "psutil>=6,<8",
]

[project.optional-dependencies]
ai = ["sentence-transformers>=5.7,<6", "transformers>=5.5,<6"]
full = ["resume-match-ai[ai]", "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3", "docling>=2,<3", "prometheus-client>=0.21,<1", "cryptography>=50,<51"]
dev = ["build>=1.2,<2", "pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6,<7", "ruff>=0.8,<1", "mypy>=1.13,<3", "pip-audit>=2.7,<3", "pip-licenses>=5,<6", "httpx2>=2,<3"]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["api*", "evaluation*", "resume_ai*"]
namespaces = false

[tool.setuptools.package-data]
evaluation = ["datasets/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ['^tests[\/]', '^build[\/]', '^dist[\/]', '^[.]venv[\/]', '^[.]cache[\/]']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1 --import-mode=importlib"
