[project]
name = "resume-match-ai"
version = "5.2.1"
description = "Analisador local, explicável e multiagente de currículos e vagas"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Vinicius Mangueira"}]
dependencies = [
  "streamlit>=1.45,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "rapidfuzz>=3.9,<4",
  "plotly>=5.24,<7",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "psutil>=6,<8",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
ai = ["sentence-transformers[onnx]>=3.2,<6", "onnxruntime>=1.19,<2", "diskcache>=5.6,<6", "structlog>=24,<26", "langgraph>=0.2,<2", "langgraph-checkpoint-sqlite>=2,<4"]
full = ["resume-match-ai[ai]", "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3", "docling>=2,<3", "lancedb>=0.18,<1", "prometheus-client>=0.21,<1", "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<3", "pip-audit>=2.7,<3", "pip-licenses>=5,<6", "httpx>=0.27,<1"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
