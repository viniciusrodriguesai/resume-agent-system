name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest --cov=resume_ai --cov-report=term-missing
        env:
          RESUME_ENVIRONMENT: test
          RESUME_EMBEDDING_ENABLED: "false"
          RESUME_RERANKER_ENABLED: "false"
          RESUME_DOCLING_ENABLED: "false"
          RESUME_PRESIDIO_ENABLED: "false"
          HF_HUB_OFFLINE: "1"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint canonical application
        run: >-
          python -m ruff check
          resume_ai/agents resume_ai/application resume_ai/domain
          resume_ai/infrastructure resume_ai/presentation resume_ai/utils
          resume_ai/settings.py api tests/conftest.py tests/unit tests/integration
          tests/test_app_smoke.py app.py
      - run: python -m pip_audit -r requirements.txt
