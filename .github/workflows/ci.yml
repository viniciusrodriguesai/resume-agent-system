name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.suite }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            python-version: "3.11"
            paths: tests/unit tests/property tests/test_app_smoke.py
          - suite: unit
            python-version: "3.12"
            paths: tests/unit tests/property tests/test_app_smoke.py
          - suite: unit
            python-version: "3.13"
            paths: tests/unit tests/property tests/test_app_smoke.py
          - suite: integration
            python-version: "3.11"
            paths: tests/integration
          - suite: security
            python-version: "3.11"
            paths: tests/security
          - suite: evaluation
            python-version: "3.11"
            paths: tests/evaluation tests/test_evaluation.py tests/test_quality_regression.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest ${{ matrix.paths }} --cov=resume_ai --cov-report=term-missing
        env:
          RESUME_ENVIRONMENT: test
          RESUME_EMBEDDING_ENABLED: "false"
          RESUME_RERANKER_ENABLED: "false"
          RESUME_DOCLING_ENABLED: "false"
          RESUME_PRESIDIO_ENABLED: "false"
          HF_HUB_OFFLINE: "1"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy .
      - run: python scripts/evaluate.py --min-accuracy 0.95 --min-macro-f1 0.90
      - run: python -m pip_audit -r requirements.txt

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build>=1.2,<2"
      - run: python -m build
