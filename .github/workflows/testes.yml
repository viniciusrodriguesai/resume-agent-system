name: Testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          RESUME_V4_USAR_EMBEDDINGS: '0'
          RESUME_V4_USAR_RERANKER: '0'
          RESUME_V4_USAR_PRESIDIO: '0'
          RESUME_V4_USAR_DOCLING: '0'
